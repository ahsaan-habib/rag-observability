[project]
name = "rag-observability"
version = "0.1.0"
description = "Tracing, quality metrics and alerting for rag-grounded"
requires-python = ">=3.10"
dependencies = [
    "rag-grounded @ git+https://github.com/ahsaan-habib/rag-grounded.git",
    "langfuse>=2.50,<3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["obs*"]
